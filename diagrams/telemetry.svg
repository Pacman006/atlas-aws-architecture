  <text fill="#D5E5F8" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" x="78" y="112">Request events are collected in CloudWatch, streamed to Kinesis, transformed to CSV, and queried from S3</text>
